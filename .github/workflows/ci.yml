name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    container: silex/emacs:${{ matrix.emacs_version }}-ci
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        emacs_version:
          - "29.4"
          - "30.2"

    steps:
      - uses: actions/checkout@v5

      # Emacs 30 bundles an older Transient; install an archive version that
      # satisfies cmdr's declared minimum before the shared actions initialize.
      - name: Install compatible Transient
        run: |
          emacs --batch --eval "(progn
            (require 'package)
            (setq package-archives '((\"gnu\" . \"https://elpa.gnu.org/packages/\")
                                     (\"nongnu\" . \"https://elpa.nongnu.org/nongnu/\")))
            (package-initialize)
            (unless (package-installed-p 'transient '(0 9 3))
              (package-refresh-contents)
              (package-install (cadr (assq 'transient package-archive-contents)))))"

      # package-lint and relint are advisory: cmdr-ops and cmdr-macros
      # intentionally export unprefixed command and macro names.
      - name: Lint Source Code
        uses: tychoish/elisp-ci/lint@main
        with:
          dependencies: "transient annotated-completing-read"
          linters: "byte-compile checkdoc package-lint relint"
          required-linters: "byte-compile checkdoc"

      - name: Run ERT Tests
        uses: tychoish/elisp-ci@main
        with:
          dependencies: "transient annotated-completing-read"

      - name: Measure Code Coverage
        uses: tychoish/elisp-ci/coverage@main
        with:
          dependencies: "transient annotated-completing-read"
          report-format: "lcov"
          output-file: "coverage/lcov.info"

      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@v5
        if: ${{ !cancelled() }}
        with:
          files: coverage/lcov.info
          fail_ci_if_error: false
